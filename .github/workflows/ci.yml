name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint:types

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  feature-map:
    name: Feature map
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm messhall-dev featuremap --check

  app:
    name: App
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The Mac app needs Xcode for swift test. A runner image without it skips the job instead of failing it.
      - id: xcode
        run: |
          if xcodebuild -version; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::no Xcode on this runner, skipping the app"; fi
      - if: steps.xcode.outputs.ok == 'true'
        run: make app-test
      - if: steps.xcode.outputs.ok == 'true'
        run: make app

  ci:
    name: CI
    if: always()
    needs: [format, lint, types, test, feature-map, app]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every shard passed
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"\|"result": "cancelled"' && exit 1 || echo ok
