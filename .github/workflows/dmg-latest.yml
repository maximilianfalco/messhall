name: Dmg latest

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dmg-latest
  cancel-in-progress: false

jobs:
  dmg:
    name: Dmg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make dmg
      - name: Replace the latest release with this build
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest app/build/Messhall.dmg --prerelease --target "$GITHUB_SHA" \
            --title "Messhall, main at ${GITHUB_SHA::7}" --notes "Built from $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}
