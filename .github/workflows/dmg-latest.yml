name: Dmg latest

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dmg-latest
  cancel-in-progress: false

jobs:
  dmg:
    name: Dmg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make dmg
      - name: Point the latest release at this build
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --target "$GITHUB_SHA" --title latest --notes ""
          gh release upload latest app/build/Messhall.dmg --clobber
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          gh release edit latest --title "Messhall, main at ${GITHUB_SHA::7}" --notes "Built from $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}
